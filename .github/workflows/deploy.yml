name: Deploy to Azure Functions

# Se despliega al hacer merge en develop (como el resto de servicios), o a mano
# desde la pestaña Actions.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest

  deploy:
    name: Publish function app
    needs: test
    runs-on: ubuntu-latest
    # Azure solo acepta el token OIDC de este job si la credencial federada de la
    # identidad vankoo-github-ci tiene el sujeto
    #   repo:liquilabshq@<id-org>/vankoo-dni-verification-function@<id-repo>:environment:development
    # y la identidad tiene el rol Contributor sobre el Function App.
    environment: development
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: liquilabs-vankoo
    # Secretos del repositorio: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
    # Variable del repositorio: AZURE_FUNCTIONAPP_NAME (salida `function_app_name` de Terraform).
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # El Function App usa el plan Flex Consumption. El build remoto instala
      # requirements.txt en Azure: el paquete solo lleva código.
      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: .
          sku: flexconsumption
          remote-build: true

      # En Flex el hostname lleva un sufijo propio: se pregunta a Azure en vez de armarlo a mano.
      - name: Smoke test (health)
        run: |
          # `az functionapp show` devuelve vacío para las apps Flex: se consulta el recurso directamente.
          host="$(az resource show -g "$RESOURCE_GROUP" -n "${{ vars.AZURE_FUNCTIONAPP_NAME }}" \
            --resource-type Microsoft.Web/sites --query properties.defaultHostName -o tsv)"
          if [ -z "$host" ]; then
            echo "No se pudo obtener el hostname del Function App." >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "https://$host/api/health"; then
              exit 0
            fi
            echo "Intento $attempt sin respuesta; reintentando en 15 s..."
            sleep 15
          done
          exit 1
