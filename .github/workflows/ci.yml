name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-uv no publica etiqueta de versión mayor (v10): se fija la exacta.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # Cuando exista uv.lock (uv lock), pasar a `uv sync --frozen` como el resto de repos.
      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy --strict)
        run: uv run mypy .

      # Los tests marcados `live` consultan eldni.com de verdad y no corren aquí.
      - name: Tests (pytest)
        run: uv run pytest
